<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemAPP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pitch-dark:   #0a1f12;
      --pitch-stripe: rgba(255,255,255,.022);
      --grass-bright: #52b788;
      --gold:         #f0a500;
      --gold-light:   #ffd166;
      --accent:       #06d6a0;
      --white:        #f4f7f5;
      --muted:        #7aab90;
      --panel:        #071b10;
      --panel-border: rgba(82,183,136,.24);
      --card-bg:      rgba(10,31,18,.84);
      --card-border:  rgba(82,183,136,.22);
      --radius:       14px;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--pitch-dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: repeating-linear-gradient(
        180deg, transparent 0, transparent 70px,
        var(--pitch-stripe) 70px, var(--pitch-stripe) 140px
      );
      pointer-events: none; z-index: 0;
    }

    .pitch-deco {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: min(680px, 100vw); height: min(680px, 100vw);
      opacity: .042; pointer-events: none; z-index: 0;
    }

    .container {
      max-width: 1080px; margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
      position: relative; z-index: 1;
    }

    /* ── HEADER ── */
    header { text-align: center; margin-bottom: 2rem; }

    .eyebrow {
      display: block;
      font-family: 'Oswald', sans-serif;
      font-size: .72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .18em; color: var(--muted); margin-bottom: .6rem;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 10vw, 7rem);
      letter-spacing: .06em; line-height: .88;
      text-shadow: 0 0 60px rgba(82,183,136,.22);
    }
    h1 em { color: var(--gold); font-style: normal; }

    .divider {
      width: 60px; height: 2px; margin: 1.1rem auto 0;
      background: linear-gradient(90deg, transparent, var(--grass-bright), transparent);
    }

    /* ── LOADING ── */
    #loading {
      text-align: center; padding: 4rem 1.5rem; color: var(--muted);
    }
    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid rgba(82,183,136,.2);
      border-top-color: var(--gold);
      animation: spin .8s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EMPTY / ERROR ── */
    #empty {
      display: none; text-align: center;
      padding: 3rem 1.5rem; color: var(--muted);
    }
    #empty .ico { font-size: 2.8rem; display: block; margin-bottom: .7rem; }

    #errorbox {
      display: none;
      background: rgba(230,57,70,.1); border: 1px solid rgba(230,57,70,.3);
      border-radius: var(--radius); padding: 1rem 1.25rem;
      color: #e63946; font-size: .85rem; margin-bottom: 1.2rem;
    }

    /* ── PANNELLO / GRIGLIA ── */
    .panel {
      display: none;
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: clamp(24px,4vw,44px) clamp(18px,3vw,32px);
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .panel-lines { position: absolute; inset: 0; opacity: .09; pointer-events: none; }

    #tracks {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    /* ── CATEGORIA ── */
    .category-header {
      display: flex; align-items: center; gap: .6rem;
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid var(--panel-border);
      padding: 0 0 .55rem; margin-bottom: 1.1rem;
      cursor: pointer; text-align: left;
    }
    .category-name {
      font-family: 'Oswald', sans-serif; font-size: .95rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em; color: var(--gold-light);
    }
    .category-count {
      font-family: 'Oswald', sans-serif; font-size: .7rem; font-weight: 600;
      color: var(--muted); border: 1px solid var(--panel-border); border-radius: 999px;
      padding: .1rem .55rem;
    }
    .category-header .chevron {
      width: 16px; height: 16px; margin-left: auto; color: var(--muted);
      transition: transform .2s ease;
    }
    .category.collapsed .category-header .chevron { transform: rotate(-90deg); }
    .category-header:hover .category-name { color: var(--gold); }

    .category-body { overflow: hidden; }
    .category.collapsed .category-body { display: none; }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
      gap: 1.9rem 1.1rem;
    }

    /* ── TILE ── */
    .tile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .55rem; }

    .pad-btn {
      width: 78px; height: 78px; flex-shrink: 0;
      border-radius: 50%; border: none; cursor: pointer;
      position: relative; overflow: hidden; padding: 0;
      background: transparent;
      box-shadow: 0 6px 0 rgba(0,0,0,.6), 0 9px 18px rgba(0,0,0,.45);
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .pad-btn:hover { box-shadow: 0 8px 0 rgba(0,0,0,.6), 0 11px 22px rgba(0,0,0,.5); }
    .pad-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 rgba(0,0,0,.6), 0 2px 7px rgba(0,0,0,.45);
    }
    .pad-btn .ball-svg { width: 100%; height: 100%; display: block; }

    .pad-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.32);
      opacity: 0; transition: opacity .2s;
    }
    .pad-btn:hover .pad-overlay { opacity: 1; }
    .tile.playing .pad-btn .pad-overlay { opacity: 1; }
    .pad-overlay svg { width: 20px; height: 20px; fill: white; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    .tile.playing .pad-btn { box-shadow: 0 6px 0 rgba(0,0,0,.6), 0 0 0 3px rgba(240,165,0,.35), 0 9px 20px rgba(0,0,0,.5); }

    .tile-title {
      font-family: 'Oswald', sans-serif; font-size: .86rem; font-weight: 600;
      line-height: 1.3; word-break: break-word; color: var(--white);
    }

    .tile-actions {
      display: flex; align-items: center; justify-content: center;
      gap: .4rem; margin-top: .1rem;
    }

    .playcount {
      display: inline-flex; align-items: center; gap: .35rem;
      border: 1px solid var(--panel-border); border-radius: 4px;
      padding: .15rem .5rem;
    }
    .playcount .pc-label {
      font-family: 'Oswald', sans-serif; font-size: .6rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    }
    .playcount .pc-value { font-family: 'Oswald', sans-serif; font-size: .74rem; font-weight: 700; color: var(--gold); }

    .share-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; padding: 0;
      background: transparent; cursor: pointer;
      border: 1px solid var(--panel-border); border-radius: 4px;
      color: var(--muted);
      transition: color .2s, border-color .2s, opacity .2s;
    }
    .share-btn:hover { color: var(--gold); border-color: rgba(240,165,0,.5); }
    .share-btn svg { width: 14px; height: 14px; fill: currentColor; display: block; }
    .share-btn[disabled] { opacity: .45; cursor: progress; }
    .share-btn.busy svg { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    /* ── TOAST ── */
    #toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translate(-50%, 16px);
      max-width: min(420px, calc(100vw - 32px));
      background: var(--panel); color: var(--white);
      border: 1px solid var(--panel-border); border-radius: 8px;
      padding: .7rem 1.1rem;
      font-family: 'Oswald', sans-serif; font-size: .78rem; letter-spacing: .02em;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
      opacity: 0; pointer-events: none; z-index: 50;
      transition: opacity .25s ease, transform .25s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ── BARRA INFERIORE ── */
    .footer-bar {
      display: none;
      flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 1rem; padding: .9rem 1.4rem;
      border: 1px solid var(--card-border); border-radius: var(--radius);
      background: var(--card-bg); margin-bottom: 2rem;
    }
    .footer-note {
      font-family: 'Oswald', sans-serif; font-size: .68rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    }
    .footer-actions { display: flex; gap: .7rem; }
    .fbtn {
      font-family: 'Oswald', sans-serif; font-size: .78rem; font-weight: 600;
      letter-spacing: .03em; padding: .5rem 1.1rem; border-radius: 6px;
      cursor: pointer; transition: opacity .2s, border-color .2s;
    }
    .fbtn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--card-border); }
    .fbtn-ghost:hover { color: var(--white); border-color: rgba(82,183,136,.5); }
    .fbtn-solid { background: var(--gold); color: #241300; border: 1px solid var(--gold); }
    .fbtn-solid:hover { opacity: .88; }

    /* ── FOOTER ── */
    footer { text-align: center; font-size: .78rem; color: rgba(122,171,144,.45); }
    footer em { color: var(--gold); font-style: normal; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .pad-btn { width: 64px; height: 64px; }
      .tile-title { font-size: .8rem; }
      /* Area di tocco più generosa sui dispositivi mobili */
      .share-btn { width: 34px; height: 34px; }
      .share-btn svg { width: 16px; height: 16px; }
    }
  </style>
</head>
<body>

  <svg class="pitch-deco" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="50" y="50" width="400" height="400" stroke="white" stroke-width="3"/>
    <circle cx="250" cy="250" r="200" stroke="white" stroke-width="3"/>
    <circle cx="250" cy="250" r="30"  stroke="white" stroke-width="3"/>
    <line x1="50" y1="250" x2="450" y2="250" stroke="white" stroke-width="3"/>
    <rect x="170" y="50"  width="160" height="60" stroke="white" stroke-width="2"/>
    <rect x="170" y="390" width="160" height="60" stroke="white" stroke-width="2"/>
    <circle cx="250" cy="250" r="4" fill="white"/>
  </svg>

  <div class="container">

    <header>
      <span class="eyebrow">Effetti sonori · Stadio</span>
      <h1>Mem<em>APP</em></h1>
      <div class="divider"></div>
    </header>

    <div id="errorbox"></div>

    <div id="loading">
      <div class="spinner"></div>
      <p>Caricamento tracce…</p>
    </div>

    <div id="empty">
      <span class="ico">🔇</span>
      <p>Nessuna traccia disponibile.</p>
    </div>

    <div class="panel" id="panel">
      <svg class="panel-lines" viewBox="0 0 600 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="150" x2="600" y2="150" stroke="white" stroke-width="1.5" stroke-dasharray="10 10"/>
        <path d="M0,0 A60,60 0 0,1 60,0" stroke="white" stroke-width="1.5" fill="none"/>
        <path d="M600,300 A60,60 0 0,1 540,300" stroke="white" stroke-width="1.5" fill="none"/>
      </svg>
      <div id="tracks"></div>
    </div>

    <div class="footer-bar" id="footer-bar">
      <span class="footer-note">Contatori salvati su questo dispositivo</span>
      <div class="footer-actions">
        <button type="button" class="fbtn fbtn-ghost" id="btn-reset">Azzera contatori</button>
        <button type="button" class="fbtn fbtn-solid" id="btn-stop">Stop</button>
      </div>
    </div>

    <footer>MemAPP &nbsp;·&nbsp; <em>⚽</em> Fatto con passione</footer>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    const ICO_PLAY  = `<svg viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg>`;
    const ICO_PAUSE = `<svg viewBox="0 0 24 24" fill="white"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="14" y="3" width="4" height="18" rx="1"/></svg>`;
    const ICO_SHARE = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08a2.9 2.9 0 0 0-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81A3 3 0 1 0 6 15c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92z"/></svg>`;
    const COUNTS_KEY        = 'memapp-playcounts';
    const LEGACY_KEY        = 'malesapp-playcounts';
    const DEFAULT_CATEGORY  = 'Generali';

    /* Tipi MIME per i formati generati da build.js */
    const MIME_BY_EXT = {
      mp3:  'audio/mpeg',
      wav:  'audio/wav',
      ogg:  'audio/ogg',
      flac: 'audio/flac',
      aac:  'audio/aac',
      m4a:  'audio/mp4'
    };

    let tracks      = [];
    let activeAudio = null;
    let uid = 0;
    let playCounts = {};

    try {
      const stored = localStorage.getItem(COUNTS_KEY);
      if (stored !== null) {
        playCounts = JSON.parse(stored) || {};
      } else {
        const legacy = localStorage.getItem(LEGACY_KEY);
        playCounts = legacy ? (JSON.parse(legacy) || {}) : {};
      }
    } catch (e) { playCounts = {}; }

    /* ── SVG pallone da calcio ── */
    function ballSVG(id) {
      return `<svg class="ball-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bg${id}" cx="36%" cy="30%" r="68%">
            <stop offset="0%"   stop-color="#f8f8f8"/>
            <stop offset="100%" stop-color="#aaaaaa"/>
          </radialGradient>
          <clipPath id="cl${id}"><circle cx="50" cy="50" r="46"/></clipPath>
        </defs>
        <circle cx="50" cy="50" r="48" fill="#111"/>
        <circle cx="50" cy="50" r="46" fill="url(#bg${id})"/>
        <g clip-path="url(#cl${id})" fill="#111" opacity=".85">
          <polygon points="50,29 63,39 58,54 42,54 37,39"/>
          <polygon points="50,4  62,13 59,27 41,27 38,13"/>
          <polygon points="77,22 83,36 73,44 62,38 63,23"/>
          <polygon points="79,59 74,73 61,75 55,62 66,53"/>
          <polygon points="21,59 34,53 45,62 39,75 26,73"/>
          <polygon points="23,22 37,23 38,38 27,44 17,36"/>
        </g>
        <circle cx="50" cy="50" r="46" fill="none" stroke="#444" stroke-width="1"/>
      </svg>`;
    }

    /* ── TOAST ── */
    let toastTimer = null;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    /* ── CONDIVISIONE ── */
    function absoluteUrl(src) {
      return new URL(src, location.href).href;
    }

    function mimeFor(file) {
      const ext = (file.split('.').pop() || '').toLowerCase();
      return MIME_BY_EXT[ext] || 'application/octet-stream';
    }

    function shareFileName(track) {
      const ext = (track.file.split('.').pop() || 'mp3').toLowerCase();
      // Rimuove i caratteri non validi nei nomi file sui vari sistemi operativi
      const base = track.name.replace(/[\\/:*?"<>|]+/g, '-').trim() || 'audio';
      return `${base}.${ext}`;
    }

    async function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    // Prova prima a condividere il file audio vero e proprio (WhatsApp, Telegram, Gmail…),
    // poi ripiega sul link e infine sulla copia negli appunti.
    async function shareTrack(track, btn) {
      const url = absoluteUrl(track.file.split('/').map(encodeURIComponent).join('/'));

      btn.disabled = true;
      btn.classList.add('busy');
      try {
        if (navigator.canShare && navigator.share) {
          try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const blob = await res.blob();
            const file = new File([blob], shareFileName(track), {
              type: blob.type && blob.type !== 'application/octet-stream' ? blob.type : mimeFor(track.file)
            });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: track.name, text: track.name });
              return;
            }
          } catch (e) {
            if (e && e.name === 'AbortError') return; // condivisione annullata dall'utente
            // Il file non è condivisibile su questa piattaforma: si passa al link
          }
        }

        if (navigator.share) {
          try {
            await navigator.share({ title: track.name, text: track.name, url });
            return;
          } catch (e) {
            if (e && e.name === 'AbortError') return;
          }
        }

        const copied = await copyToClipboard(url);
        toast(copied ? 'Link copiato negli appunti' : 'Condivisione non disponibile: ' + url);
      } finally {
        btn.disabled = false;
        btn.classList.remove('busy');
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorbox');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function setUI(state) {
      document.getElementById('loading').style.display    = state === 'loading' ? 'block' : 'none';
      document.getElementById('panel').style.display      = state === 'loaded'  ? 'block' : 'none';
      document.getElementById('footer-bar').style.display = state === 'loaded'  ? 'flex'  : 'none';
      document.getElementById('empty').style.display       = state === 'empty'   ? 'block' : 'none';
    }

    function persistCounts() {
      try { localStorage.setItem(COUNTS_KEY, JSON.stringify(playCounts)); } catch (e) { /* storage non disponibile */ }
    }

    function stopAll() {
      if (activeAudio) { activeAudio.pause(); activeAudio.currentTime = 0; }
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('playing'));
      document.querySelectorAll('.pad-overlay').forEach(o => o.innerHTML = ICO_PLAY);
      document.querySelectorAll('.pad-btn').forEach(b => {
        b.setAttribute('aria-pressed', 'false');
        b.setAttribute('aria-label', (b.getAttribute('aria-label') || '').replace(/^Pausa/, 'Riproduci'));
      });
      activeAudio = null;
    }

    function groupByCategory(list) {
      const map = new Map();
      list.forEach(t => {
        const cat = t.category || DEFAULT_CATEGORY;
        if (!map.has(cat)) map.set(cat, []);
        map.get(cat).push(t);
      });
      return map;
    }

    function renderTracks() {
      const root = document.getElementById('tracks');
      root.innerHTML = '';

      const groups     = groupByCategory(tracks);
      const categories = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b, 'it'));

      categories.forEach(cat => root.appendChild(buildCategorySection(cat, groups.get(cat))));
    }

    function buildCategorySection(category, items) {
      const section = document.createElement('section');
      section.className = 'category';

      section.innerHTML = `
        <button type="button" class="category-header" aria-expanded="true">
          <span class="category-name">${escHtml(category)}</span>
          <span class="category-count">${items.length}</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6,9 12,15 18,9"/>
          </svg>
        </button>
        <div class="category-body"><div class="category-grid"></div></div>`;

      const grid = section.querySelector('.category-grid');
      items.forEach(t => grid.appendChild(buildTile(t)));

      const header = section.querySelector('.category-header');
      header.addEventListener('click', () => {
        const collapsed = section.classList.toggle('collapsed');
        header.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      });

      return section;
    }

    function buildTile(track) {
      const id   = uid++;
      const tile = document.createElement('div');
      tile.className = 'tile';
      const count = playCounts[track.file] || 0;

      tile.innerHTML = `
        <button class="pad-btn" aria-pressed="false" aria-label="Riproduci ${escHtml(track.name)}">
          ${ballSVG(id)}
          <span class="pad-overlay">${ICO_PLAY}</span>
        </button>
        <div class="tile-title">${escHtml(track.name)}</div>
        <div class="tile-actions">
          <div class="playcount">
            <span class="pc-label">play</span>
            <span class="pc-value" id="pc${id}">${count}</span>
          </div>
          <button type="button" class="share-btn" title="Condividi ${escHtml(track.name)}" aria-label="Condividi ${escHtml(track.name)}">${ICO_SHARE}</button>
        </div>`;

      // Codifica il nome del file per l'URL (gestisce spazi e caratteri speciali)
      const src     = track.file.split('/').map(encodeURIComponent).join('/');
      const audio   = new Audio();
      audio.preload = 'metadata'; // evita di scaricare l'intero file per ogni traccia al caricamento
      audio.src     = src;

      const padBtn   = tile.querySelector('.pad-btn');
      const overlay  = tile.querySelector('.pad-overlay');
      const pcEl     = tile.querySelector('#pc' + id);
      const shareBtn = tile.querySelector('.share-btn');

      shareBtn.addEventListener('click', () => { shareTrack(track, shareBtn); });

      audio.addEventListener('ended', () => {
        audio.currentTime = 0;
        tile.classList.remove('playing');
        overlay.innerHTML = ICO_PLAY;
        padBtn.setAttribute('aria-pressed', 'false');
        padBtn.setAttribute('aria-label', 'Riproduci ' + track.name);
        activeAudio = null;
      });

      padBtn.addEventListener('click', () => {
        if (activeAudio && activeAudio !== audio) stopAll();
        if (audio.paused) {
          audio.play().catch(() => {});
          tile.classList.add('playing');
          overlay.innerHTML = ICO_PAUSE;
          padBtn.setAttribute('aria-pressed', 'true');
          padBtn.setAttribute('aria-label', 'Pausa ' + track.name);
          activeAudio = audio;

          playCounts[track.file] = (playCounts[track.file] || 0) + 1;
          pcEl.textContent = playCounts[track.file];
          persistCounts();
        } else {
          audio.pause();
          tile.classList.remove('playing');
          overlay.innerHTML = ICO_PLAY;
          padBtn.setAttribute('aria-pressed', 'false');
          padBtn.setAttribute('aria-label', 'Riproduci ' + track.name);
        }
      });

      return tile;
    }

    function escHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    document.getElementById('btn-stop').addEventListener('click', stopAll);
    document.getElementById('btn-reset').addEventListener('click', () => {
      playCounts = {};
      persistCounts();
      document.querySelectorAll('.pc-value').forEach(el => el.textContent = '0');
    });

    /* ── avvio: carica tracks.json ── */
    (async () => {
      setUI('loading');
      try {
        const r = await fetch('tracks.json');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        tracks = await r.json();
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        showError('Impossibile caricare le tracce: ' + e.message);
        return;
      }

      if (tracks.length === 0) { setUI('empty'); return; }

      renderTracks();
      setUI('loaded');
    })();

  })();
  </script>
</body>
</html>
