<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MalesAPP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pitch-dark:   #0a1f12;
      --pitch-stripe: rgba(255,255,255,.022);
      --grass-bright: #52b788;
      --gold:         #f0a500;
      --gold-light:   #ffd166;
      --accent:       #06d6a0;
      --white:        #f4f7f5;
      --muted:        #7aab90;
      --panel:        #071b10;
      --panel-border: rgba(82,183,136,.24);
      --card-bg:      rgba(10,31,18,.84);
      --card-border:  rgba(82,183,136,.22);
      --radius:       14px;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--pitch-dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: repeating-linear-gradient(
        180deg, transparent 0, transparent 70px,
        var(--pitch-stripe) 70px, var(--pitch-stripe) 140px
      );
      pointer-events: none; z-index: 0;
    }

    .pitch-deco {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: min(680px, 100vw); height: min(680px, 100vw);
      opacity: .042; pointer-events: none; z-index: 0;
    }

    .container {
      max-width: 1080px; margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
      position: relative; z-index: 1;
    }

    /* ── HEADER ── */
    header { text-align: center; margin-bottom: 2rem; }

    .eyebrow {
      display: block;
      font-family: 'Oswald', sans-serif;
      font-size: .72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .18em; color: var(--muted); margin-bottom: .6rem;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 10vw, 7rem);
      letter-spacing: .06em; line-height: .88;
      text-shadow: 0 0 60px rgba(82,183,136,.22);
    }
    h1 em { color: var(--gold); font-style: normal; }

    .divider {
      width: 60px; height: 2px; margin: 1.1rem auto 0;
      background: linear-gradient(90deg, transparent, var(--grass-bright), transparent);
    }

    /* ── LOADING ── */
    #loading {
      text-align: center; padding: 4rem 1.5rem; color: var(--muted);
    }
    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid rgba(82,183,136,.2);
      border-top-color: var(--gold);
      animation: spin .8s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EMPTY / ERROR ── */
    #empty {
      display: none; text-align: center;
      padding: 3rem 1.5rem; color: var(--muted);
    }
    #empty .ico { font-size: 2.8rem; display: block; margin-bottom: .7rem; }

    #errorbox {
      display: none;
      background: rgba(230,57,70,.1); border: 1px solid rgba(230,57,70,.3);
      border-radius: var(--radius); padding: 1rem 1.25rem;
      color: #e63946; font-size: .85rem; margin-bottom: 1.2rem;
    }

    /* ── BARRA DI CONTROLLO ── */
    #control-bar {
      display: none;
      align-items: center; flex-wrap: wrap; gap: 1.25rem 2rem;
      justify-content: space-between;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 1.1rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .cb-status { display: flex; align-items: center; gap: .9rem; min-width: 0; flex: 1; }
    .led {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
      background: var(--muted); box-shadow: 0 0 0 3px rgba(122,171,144,.15);
      transition: background .3s, box-shadow .3s;
    }
    #control-bar.active .led {
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(240,165,0,.2);
      animation: ledPulse 1s ease-in-out infinite;
    }
    @keyframes ledPulse { 0%,100%{ opacity:1 } 50%{ opacity:.4 } }
    .cb-text { min-width: 0; }
    .cb-label {
      font-family: 'Oswald', sans-serif;
      font-size: .68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .14em; color: var(--muted);
    }
    .cb-value {
      font-family: 'Oswald', sans-serif; font-weight: 600;
      font-size: 1.02rem; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 44vw;
    }

    .master-eq { display: flex; align-items: flex-end; gap: 3px; height: 24px; flex-shrink: 0; }
    .master-eq span {
      width: 3px; border-radius: 2px; background: var(--gold);
      opacity: .18; transition: opacity .25s;
    }
    #control-bar.active .master-eq span {
      opacity: 1; animation: barBounce .75s ease-in-out infinite alternate;
    }
    .master-eq span:nth-child(1){ height:35%; animation-delay:0s; }
    .master-eq span:nth-child(2){ height:75%; animation-delay:.12s; }
    .master-eq span:nth-child(3){ height:100%; animation-delay:.28s; }
    .master-eq span:nth-child(4){ height:55%; animation-delay:.16s; }
    .master-eq span:nth-child(5){ height:85%; animation-delay:.34s; }
    @keyframes barBounce { from{ transform:scaleY(.3) } to{ transform:scaleY(1) } }

    .cb-stats { display: flex; gap: 1.75rem; flex-shrink: 0; }
    .stat-label {
      font-family: 'Oswald', sans-serif;
      font-size: .64rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .12em; color: var(--muted);
    }
    .stat-value {
      font-family: 'Oswald', sans-serif; font-weight: 700;
      font-size: 1.5rem; line-height: 1.1; letter-spacing: -.02em;
    }
    .stat-value.accent { color: var(--gold); }

    /* ── PANNELLO / GRIGLIA ── */
    .panel {
      display: none;
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: clamp(24px,4vw,44px) clamp(18px,3vw,32px);
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .panel-lines { position: absolute; inset: 0; opacity: .09; pointer-events: none; }

    #tracks {
      position: relative;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
      gap: 1.9rem 1.1rem;
    }

    /* ── TILE ── */
    .tile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .55rem; }

    .pad-btn {
      width: 78px; height: 78px; flex-shrink: 0;
      border-radius: 50%; border: none; cursor: pointer;
      position: relative; overflow: hidden; padding: 0;
      background: transparent;
      box-shadow: 0 6px 0 rgba(0,0,0,.6), 0 9px 18px rgba(0,0,0,.45);
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .pad-btn:hover { box-shadow: 0 8px 0 rgba(0,0,0,.6), 0 11px 22px rgba(0,0,0,.5); }
    .pad-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 rgba(0,0,0,.6), 0 2px 7px rgba(0,0,0,.45);
    }
    .pad-btn .ball-svg { width: 100%; height: 100%; display: block; }

    .pad-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.32);
      opacity: 0; transition: opacity .2s;
    }
    .pad-btn:hover .pad-overlay { opacity: 1; }
    .tile.playing .pad-btn .pad-overlay { opacity: 1; }
    .pad-overlay svg { width: 20px; height: 20px; fill: white; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    .tile.playing .pad-btn { box-shadow: 0 6px 0 rgba(0,0,0,.6), 0 0 0 3px rgba(240,165,0,.35), 0 9px 20px rgba(0,0,0,.5); }

    .tile-title {
      font-family: 'Oswald', sans-serif; font-size: .86rem; font-weight: 600;
      line-height: 1.3; word-break: break-word; color: var(--white);
    }
    .tile-num { color: var(--gold); font-weight: 900; letter-spacing: .05em; }
    .tile-badge {
      display: inline-block; margin-left: .3rem;
      font-size: .6rem; font-weight: 600; letter-spacing: .05em;
      color: var(--muted); border: 1px solid var(--panel-border);
      border-radius: 4px; padding: .04rem .35rem; vertical-align: middle;
    }

    .progress-range {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 3px; margin-top: .15rem;
      background: rgba(255,255,255,.1); border-radius: 2px;
      accent-color: var(--gold); cursor: pointer;
    }
    .progress-range::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%;
      background: var(--gold); cursor: pointer; box-shadow: 0 0 0 3px rgba(240,165,0,.2);
    }
    .progress-range::-moz-range-thumb {
      width: 10px; height: 10px; border: none; border-radius: 50%; background: var(--gold); cursor: pointer;
    }
    .time-row {
      display: flex; justify-content: space-between; width: 100%;
      font-family: 'Oswald', sans-serif; font-size: .68rem; color: var(--muted);
    }
    .time-row .track-dur.error { color: #e63946; }

    .playcount {
      display: inline-flex; align-items: center; gap: .35rem;
      border: 1px solid var(--panel-border); border-radius: 4px;
      padding: .15rem .5rem; margin-top: .1rem;
    }
    .playcount .pc-label {
      font-family: 'Oswald', sans-serif; font-size: .6rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    }
    .playcount .pc-value { font-family: 'Oswald', sans-serif; font-size: .74rem; font-weight: 700; color: var(--gold); }

    /* ── BARRA INFERIORE ── */
    .footer-bar {
      display: none;
      flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 1rem; padding: .9rem 1.4rem;
      border: 1px solid var(--card-border); border-radius: var(--radius);
      background: var(--card-bg); margin-bottom: 2rem;
    }
    .footer-note {
      font-family: 'Oswald', sans-serif; font-size: .68rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    }
    .footer-actions { display: flex; gap: .7rem; }
    .fbtn {
      font-family: 'Oswald', sans-serif; font-size: .78rem; font-weight: 600;
      letter-spacing: .03em; padding: .5rem 1.1rem; border-radius: 6px;
      cursor: pointer; transition: opacity .2s, border-color .2s;
    }
    .fbtn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--card-border); }
    .fbtn-ghost:hover { color: var(--white); border-color: rgba(82,183,136,.5); }
    .fbtn-solid { background: var(--gold); color: #241300; border: 1px solid var(--gold); }
    .fbtn-solid:hover { opacity: .88; }

    /* ── FOOTER ── */
    footer { text-align: center; font-size: .78rem; color: rgba(122,171,144,.45); }
    footer em { color: var(--gold); font-style: normal; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .master-eq { display: none; }
      .cb-value { max-width: 60vw; }
    }
    @media (max-width: 480px) {
      .pad-btn { width: 64px; height: 64px; }
      .tile-title { font-size: .8rem; }
      #control-bar { justify-content: flex-start; }
      .cb-stats { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <svg class="pitch-deco" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="50" y="50" width="400" height="400" stroke="white" stroke-width="3"/>
    <circle cx="250" cy="250" r="200" stroke="white" stroke-width="3"/>
    <circle cx="250" cy="250" r="30"  stroke="white" stroke-width="3"/>
    <line x1="50" y1="250" x2="450" y2="250" stroke="white" stroke-width="3"/>
    <rect x="170" y="50"  width="160" height="60" stroke="white" stroke-width="2"/>
    <rect x="170" y="390" width="160" height="60" stroke="white" stroke-width="2"/>
    <circle cx="250" cy="250" r="4" fill="white"/>
  </svg>

  <div class="container">

    <header>
      <span class="eyebrow">Effetti sonori · Stadio</span>
      <h1>Males<em>APP</em></h1>
      <div class="divider"></div>
    </header>

    <div id="errorbox"></div>

    <div id="loading">
      <div class="spinner"></div>
      <p>Caricamento tracce…</p>
    </div>

    <div id="control-bar">
      <div class="cb-status">
        <span class="led" id="led"></span>
        <div class="cb-text">
          <div class="cb-label">In riproduzione</div>
          <div class="cb-value" id="now-playing" aria-live="polite">— in attesa —</div>
        </div>
      </div>
      <div class="master-eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="cb-stats">
        <div class="stat">
          <div class="stat-label">Tracce</div>
          <div class="stat-value" id="count">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Riproduzioni</div>
          <div class="stat-value accent" id="total-plays">0</div>
        </div>
      </div>
    </div>

    <div id="empty">
      <span class="ico">🔇</span>
      <p>Nessuna traccia disponibile.</p>
    </div>

    <div class="panel" id="panel">
      <svg class="panel-lines" viewBox="0 0 600 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="150" x2="600" y2="150" stroke="white" stroke-width="1.5" stroke-dasharray="10 10"/>
        <path d="M0,0 A60,60 0 0,1 60,0" stroke="white" stroke-width="1.5" fill="none"/>
        <path d="M600,300 A60,60 0 0,1 540,300" stroke="white" stroke-width="1.5" fill="none"/>
      </svg>
      <div id="tracks"></div>
    </div>

    <div class="footer-bar" id="footer-bar">
      <span class="footer-note">Contatori salvati su questo dispositivo</span>
      <div class="footer-actions">
        <button type="button" class="fbtn fbtn-ghost" id="btn-reset">Azzera contatori</button>
        <button type="button" class="fbtn fbtn-solid" id="btn-stop">Stop</button>
      </div>
    </div>

    <footer>MalesAPP &nbsp;·&nbsp; <em>⚽</em> Fatto con passione</footer>
  </div>

  <script>
  (() => {
    const ICO_PLAY  = `<svg viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg>`;
    const ICO_PAUSE = `<svg viewBox="0 0 24 24" fill="white"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="14" y="3" width="4" height="18" rx="1"/></svg>`;
    const COUNTS_KEY = 'malesapp-playcounts';

    let tracks      = [];
    let activeAudio = null;
    let uid = 0;
    let playCounts = {};

    try { playCounts = JSON.parse(localStorage.getItem(COUNTS_KEY)) || {}; } catch (e) { playCounts = {}; }

    /* ── SVG pallone da calcio ── */
    function ballSVG(id) {
      return `<svg class="ball-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bg${id}" cx="36%" cy="30%" r="68%">
            <stop offset="0%"   stop-color="#f8f8f8"/>
            <stop offset="100%" stop-color="#aaaaaa"/>
          </radialGradient>
          <clipPath id="cl${id}"><circle cx="50" cy="50" r="46"/></clipPath>
        </defs>
        <circle cx="50" cy="50" r="48" fill="#111"/>
        <circle cx="50" cy="50" r="46" fill="url(#bg${id})"/>
        <g clip-path="url(#cl${id})" fill="#111" opacity=".85">
          <polygon points="50,29 63,39 58,54 42,54 37,39"/>
          <polygon points="50,4  62,13 59,27 41,27 38,13"/>
          <polygon points="77,22 83,36 73,44 62,38 63,23"/>
          <polygon points="79,59 74,73 61,75 55,62 66,53"/>
          <polygon points="21,59 34,53 45,62 39,75 26,73"/>
          <polygon points="23,22 37,23 38,38 27,44 17,36"/>
        </g>
        <circle cx="50" cy="50" r="46" fill="none" stroke="#444" stroke-width="1"/>
      </svg>`;
    }

    function fmtTime(s) {
      if (!isFinite(s) || isNaN(s)) return '—:——';
      return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    }

    function showError(msg) {
      const el = document.getElementById('errorbox');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function setUI(state) {
      document.getElementById('loading').style.display     = state === 'loading' ? 'block' : 'none';
      document.getElementById('control-bar').style.display  = state === 'loaded'  ? 'flex'  : 'none';
      document.getElementById('panel').style.display        = state === 'loaded'  ? 'block' : 'none';
      document.getElementById('footer-bar').style.display   = state === 'loaded'  ? 'flex'  : 'none';
      document.getElementById('empty').style.display        = state === 'empty'   ? 'block' : 'none';
    }

    function persistCounts() {
      try { localStorage.setItem(COUNTS_KEY, JSON.stringify(playCounts)); } catch (e) { /* storage non disponibile */ }
    }

    function totalPlays() {
      return Object.values(playCounts).reduce((a, b) => a + b, 0);
    }

    function updateTotalPlays() {
      document.getElementById('total-plays').textContent = totalPlays();
    }

    function stopAll() {
      if (activeAudio) { activeAudio.pause(); activeAudio.currentTime = 0; }
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('playing'));
      document.querySelectorAll('.pad-overlay').forEach(o => o.innerHTML = ICO_PLAY);
      document.querySelectorAll('.pad-btn').forEach(b => {
        b.setAttribute('aria-pressed', 'false');
        b.setAttribute('aria-label', (b.getAttribute('aria-label') || '').replace(/^Pausa/, 'Riproduci'));
      });
      document.querySelectorAll('.progress-range').forEach(r => r.value = 0);
      document.querySelectorAll('.time-row span[id^="cur"]').forEach(t => t.textContent = '0:00');
      document.getElementById('now-playing').textContent = '— in attesa —';
      document.getElementById('control-bar').classList.remove('active');
      activeAudio = null;
    }

    function renderTracks() {
      const grid = document.getElementById('tracks');
      grid.innerHTML = '';
      tracks.forEach((t, i) => grid.appendChild(buildTile(t, i)));
      updateTotalPlays();
    }

    function buildTile(track, index) {
      const id   = uid++;
      const tile = document.createElement('div');
      tile.className = 'tile';
      const badge = track.badge || (track.file.split('.').pop() || '').toUpperCase();
      const num   = String(index + 1).padStart(2, '0');
      const count = playCounts[track.file] || 0;

      tile.innerHTML = `
        <button class="pad-btn" aria-pressed="false" aria-label="Riproduci ${escHtml(track.name)}">
          ${ballSVG(id)}
          <span class="pad-overlay">${ICO_PLAY}</span>
        </button>
        <div class="tile-title"><span class="tile-num">${num}</span> ${escHtml(track.name)}${badge ? `<span class="tile-badge">${escHtml(badge)}</span>` : ''}</div>
        <input type="range" class="progress-range" id="rng${id}" min="0" max="100" value="0" step="0.1" aria-label="Posizione riproduzione">
        <div class="time-row">
          <span id="cur${id}">0:00</span>
          <span class="track-dur" id="dur${id}">—:——</span>
        </div>
        <div class="playcount">
          <span class="pc-label">play</span>
          <span class="pc-value" id="pc${id}">${count}</span>
        </div>`;

      // Codifica il nome del file per l'URL (gestisce spazi e caratteri speciali)
      const src     = track.file.split('/').map(encodeURIComponent).join('/');
      const audio   = new Audio();
      audio.preload = 'metadata'; // evita di scaricare l'intero file per ogni traccia al caricamento
      audio.src     = src;

      const padBtn  = tile.querySelector('.pad-btn');
      const overlay = tile.querySelector('.pad-overlay');
      const durEl   = tile.querySelector('#dur' + id);
      const curEl   = tile.querySelector('#cur' + id);
      const rng     = tile.querySelector('#rng' + id);
      const pcEl    = tile.querySelector('#pc' + id);

      function resetProgress() {
        rng.value = 0;
        curEl.textContent = '0:00';
      }

      audio.addEventListener('loadedmetadata', () => {
        durEl.textContent = fmtTime(audio.duration);
      });
      audio.addEventListener('error', () => {
        durEl.textContent = 'Errore caricamento';
        durEl.classList.add('error');
      });
      audio.addEventListener('timeupdate', () => {
        curEl.textContent = fmtTime(audio.currentTime);
        if (isFinite(audio.duration) && audio.duration > 0) {
          rng.value = (audio.currentTime / audio.duration) * 100;
        }
      });
      audio.addEventListener('ended', () => {
        audio.currentTime = 0;
        tile.classList.remove('playing');
        overlay.innerHTML = ICO_PLAY;
        padBtn.setAttribute('aria-pressed', 'false');
        padBtn.setAttribute('aria-label', 'Riproduci ' + track.name);
        resetProgress();
        document.getElementById('now-playing').textContent = '— in attesa —';
        document.getElementById('control-bar').classList.remove('active');
        activeAudio = null;
      });

      rng.addEventListener('input', () => {
        if (isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = (rng.value / 100) * audio.duration;
        }
      });

      padBtn.addEventListener('click', () => {
        if (activeAudio && activeAudio !== audio) stopAll();
        if (audio.paused) {
          audio.play().catch(() => {});
          tile.classList.add('playing');
          overlay.innerHTML = ICO_PAUSE;
          padBtn.setAttribute('aria-pressed', 'true');
          padBtn.setAttribute('aria-label', 'Pausa ' + track.name);
          activeAudio = audio;

          playCounts[track.file] = (playCounts[track.file] || 0) + 1;
          pcEl.textContent = playCounts[track.file];
          persistCounts();
          updateTotalPlays();

          const label = track.name.length > 36 ? track.name.slice(0, 36) + '…' : track.name;
          document.getElementById('now-playing').textContent = label;
          document.getElementById('control-bar').classList.add('active');
        } else {
          audio.pause();
          tile.classList.remove('playing');
          overlay.innerHTML = ICO_PLAY;
          padBtn.setAttribute('aria-pressed', 'false');
          padBtn.setAttribute('aria-label', 'Riproduci ' + track.name);
          document.getElementById('now-playing').textContent = '— in attesa —';
          document.getElementById('control-bar').classList.remove('active');
        }
      });

      return tile;
    }

    function escHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    document.getElementById('btn-stop').addEventListener('click', stopAll);
    document.getElementById('btn-reset').addEventListener('click', () => {
      playCounts = {};
      persistCounts();
      document.querySelectorAll('.pc-value').forEach(el => el.textContent = '0');
      updateTotalPlays();
    });

    /* ── avvio: carica tracks.json ── */
    (async () => {
      setUI('loading');
      try {
        const r = await fetch('tracks.json');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        tracks = await r.json();
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        showError('Impossibile caricare le tracce: ' + e.message);
        return;
      }

      if (tracks.length === 0) { setUI('empty'); return; }

      document.getElementById('count').textContent = tracks.length;
      renderTracks();
      setUI('loaded');
    })();

  })();
  </script>
</body>
</html>
